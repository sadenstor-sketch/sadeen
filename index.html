<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SADEEN</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* تعديل SADEEN - الصورة على قد الموقع */
      .shell {
        flex-direction: column !important;
        align-items: center !important;
        max-width: 1000px !important;
        width: 95% !important;
        margin: 0 auto !important;
      }
      .meme {
        width: 100% !important;
        max-width: 1000px !important;
        height: auto !important;
        display: block !important;
        border-radius: 16px !important;
        margin-bottom: 20px !important;
      }
      .panel {
        width: 100% !important;
        max-width: 1000px !important;
      }
      #brand {
        font-size: 36px !important;
        text-align: center !important;
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>SADEEN</b></div>

    <div class="shell">
      <img class="meme" src="meme.png" alt="" />

      <main class="panel">
        <p class="lede">SADEEN - PS4 firmware 12.00 &ndash; 14.02</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
          <p class="count" id="cache" aria-live="polite"></p>
        </form>
      </main>
    </div>

    <p class="byline">SADEEN | by well0nez/m0zz</p>
    <script src="launch.js"></script>
  </body>
</html>
