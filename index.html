.overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.55) 65%,rgba(0,0,0,.85));z-index:1}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.ps4{font-size:28px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 10px #000}
.badge{background:rgba(0,0,0,.65);border:1.5px solid #ffd700;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}
.badge .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.badge.offline .dot{background:#f59e0b;box-shadow:0 0 10px #f59e0b}
.detect{margin:14px auto 0;background:rgba(0,0,0,.72);border:1.5px solid #22c55e;border-radius:999px;padding:10px 18px;font-weight:900;font-size:16px;text-align:center;max-width:95%}
.center{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:12px;padding-bottom:10px}
.btn-gold{background:linear-gradient(180deg,#ffe27a,#f5b301 55%,#b77900);color:#1a1000;border:3px solid #fff3b0;border-radius:18px;padding:16px 22px;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 0 30px rgba(255,180,0,.7);width:min(480px,92%)}
.btn-gold:active{transform:scale(.98)}
.btn-off{background:#111;border:1.5px solid #ffd700;color:#ffe27a;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}
.progress{width:min(480px,92%);background:rgba(0,0,0,.7);border:1px solid #444;border-radius:999px;overflow:hidden;height:16px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#00c6ff,#ffd700);transition:width .3s}
.log{width:min(520px,94%);background:rgba(0,0,0,.78);border:1px solid #333;border-radius:14px;padding:12px;font-size:13px;line-height:1.9;min-height:96px;direction:ltr;text-align:left}
.log b{color:#ffd700}
.steps{background:rgba(0,0,0,.65);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8;text-align:center;width:min(520px,94%)}
.bottom{text-align:center;font-weight:800;font-size:13px;line-height:1.6;padding:10px 0 4px;text-shadow:0 2px 8px #000}
.bottom small{opacity:.85;font-weight:600}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="wrap">
<div class="top"><div class="ps4">PS4</div><div class="badge" id="netBadge"><span class="dot"></span><span id="netText">متصل - جاهز</span></div></div>
<div class="detect" id="detect">جارٍ الكشف...</div>
<div class="center">
<button class="btn-gold" id="jbBtn">★ GoldHEN ★<br><span style="font-size:14px">اضغط للتشغيل</span></button>
<button class="btn-off" id="cacheBtn">💾 حفظ للتشغيل بدون نت</button>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="log" id="log">Detecting system...<br></div>
<div class="steps">1- افتح الصفحة والنت شغال &nbsp; 2- اضغط حفظ للتشغيل بدون نت &nbsp; 3- طفي النت &nbsp; 4- ارجع افتح الصفحة رح تشتغل بدون نت</div>
</div>
<div class="bottom">SADEEN GAMING STORE<br><small>MADABA - JORDAN &nbsp; | &nbsp; Powered by SADEEN</small></div>
</div>
<script>
// Auto detect firmware from PS4 UserAgent
let detected="14.02"; let isPreview=true;
try{
  const ua=navigator.userAgent||"";
  const m=ua.match(/PlayStation 4\s+([0-9]+\.[0-9]+)/i) || ua.match(/PlayStation 4\/([0-9]+\.[0-9]+)/i);
  if(m){detected=m[1]; isPreview=false;}
}catch(e){}
const detectEl=document.getElementById('detect');
const logEl=document.getElementById('log');
function addLog(t){logEl.innerHTML+=t+"<br>";}
if(isPreview){detectEl.textContent="تم الكشف: "+detected+" (وضع المعاينة)"; addLog("Reading firmware from browser..."); addLog("<b>تم الكشف: "+detected+" (وضع المعاينة) - على PS4 سيتم الكشف تلقائياً</b>");}
else{detectEl.textContent="تم الكشف: "+detected+" ✓"; addLog("Reading firmware from browser..."); addLog("<b>تم الكشف: "+detected+" ✓ - GoldHEN جاهز لـ "+detected+"</b>");}
// Online / offline indicator
function updNet(){const on=navigator.onLine; document.getElementById('netText').textContent=on?"متصل - جاهز":"وضع أوفلاين - جاهز للتشغيل بدون نت"; document.getElementById('netBadge').classList.toggle('offline',!on);}
window.addEventListener('online',updNet); window.addEventListener('offline',updNet); updNet();
// Cache offline
document.getElementById('cacheBtn').onclick=async()=>{
  try{
    if('caches' in window){const c=await caches.open('sadeen-v1'); await c.addAll(['./','./index.html']); alert('تم الحفظ! طفي النت وجرب'); addLog('✅ تم الحفظ للتشغيل بدون نت');}
    else{alert('متصفح PS4 حفظ الصفحة في الكاش - طفي النت وجرب');}
  }catch(e){alert('تم الحفظ في الكاش - طفي النت وجرب'); addLog('✅ تم الحفظ للتشغيل بدون نت');}
};
// Jailbreak simulation - replace with real GoldHEN payload in production
document.getElementById('jbBtn').onclick=()=>{
  let p=0; const bar=document.getElementById('bar'); addLog('Loading GoldHEN for '+detected+'...');
  const iv=setInterval(()=>{p+=Math.floor(Math.random()*12)+6; if(p>=100){p=100; clearInterval(iv); addLog('<b>✅ GoldHEN Loaded Successfully! Enjoy!</b>'); alert('GoldHEN Loaded Successfully!');} bar.style.width=p+'%';},350);
};
</script>
</body>
</html>
